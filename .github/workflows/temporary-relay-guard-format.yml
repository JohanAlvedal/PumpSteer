name: Temporary Relay Guard Formatter

on:
  push:
    branches:
      - feature/ohmigo-relay-guard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ohmigo-relay-guard
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff==0.15.8

      - name: Format Relay Guard changes
        run: |
          ruff format             custom_components/pumpsteer/options_flow.py             custom_components/pumpsteer/relay_guard.py             tests/test_ohmigo_relay_guard.py

      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed"
          else
            git add               custom_components/pumpsteer/options_flow.py               custom_components/pumpsteer/relay_guard.py               tests/test_ohmigo_relay_guard.py
            git commit -m "Format Relay Guard implementation"
            git push origin HEAD:feature/ohmigo-relay-guard
          fi
