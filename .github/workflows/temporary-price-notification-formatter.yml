name: Temporary Price Notification Formatter

on:
  push:
    branches:
      - feature/price-notification-preferences

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/price-notification-preferences

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff==0.15.8

      - name: Format notification files
        run: |
          ruff format custom_components/pumpsteer/options_flow.py tests/test_notification_current_price.py tests/test_notification_preferences.py

      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed"
          else
            git add custom_components/pumpsteer/options_flow.py tests/test_notification_current_price.py tests/test_notification_preferences.py
            git commit -m "Format price notification preferences"
            git push origin HEAD:feature/price-notification-preferences
          fi
