name: Temporary Ruff format

on:
  push:
    branches:
      - v3-development

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Format only the new V3 files
        run: |
          ruff format custom_components/pumpsteer/sensor.py \
            custom_components/pumpsteer/v3/control/preheat.py \
            custom_components/pumpsteer/v3/ha/virtual_sensor.py \
            tests/v3/test_preheat_planner.py

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/pumpsteer/sensor.py \
            custom_components/pumpsteer/v3/control/preheat.py \
            custom_components/pumpsteer/v3/ha/virtual_sensor.py \
            tests/v3/test_preheat_planner.py
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "Format V3 preheat and virtual sensor"
            git push
          fi
