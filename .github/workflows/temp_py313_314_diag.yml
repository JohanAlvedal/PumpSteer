name: Temporary Python 3.13-3.14 diagnostics

on:
  push:
    branches: [v3-development]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install 3.13 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pylint homeassistant pytest-homeassistant-custom-component

      - name: Capture Python 3.13 pytest
        shell: bash
        run: |
          set +e
          pytest tests/ -q --tb=short > .ci_pytest_313.txt 2>&1
          status=$?
          echo "PYTEST_EXIT_CODE=$status" >> .ci_pytest_313.txt
          exit 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install 3.14 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pylint homeassistant pytest-homeassistant-custom-component

      - name: Capture Python 3.14 pytest
        shell: bash
        run: |
          set +e
          pytest tests/ -q --tb=short > .ci_pytest_314.txt 2>&1
          status=$?
          echo "PYTEST_EXIT_CODE=$status" >> .ci_pytest_314.txt
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci_pytest_313.txt .ci_pytest_314.txt
          git commit -m "ci: capture Python 3.13 and 3.14 pytest diagnostics"
          git push
