name: Temporary Current Price Formatter

on:
  push:
    branches:
      - feature/notification-current-price

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/notification-current-price
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff==0.15.8

      - name: Format current price test
        run: ruff format tests/test_notification_current_price.py

      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed"
          else
            git add tests/test_notification_current_price.py
            git commit -m "Format current price notification tests"
            git push origin HEAD:feature/notification-current-price
          fi
